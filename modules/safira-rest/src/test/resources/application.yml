# Mesmo grupo readiness do application.yml do safira-app (a aplicação real).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,fonteDeConfianca

safira:
  # ---------------------------------------------------------------------------
  # Configuração das Pipelines de Assinatura e Verificação
  #
  # Estrutura:
  #   pipelines: Lista de definições de pipelines.
  #     - version: Identificador da versão do Guia de Implementação FHIR.
  #                Formato: "URL_CANONICA|VERSAO"
  #     - operation: Tipo da operação. Valores possíveis: [SIGNING, VALIDATION]
  #     - steps: Lista ordenada de IDs dos passos (steps) a serem executados.
  # ---------------------------------------------------------------------------
  pipelines:
    # -------------------------------------------------------------------------
    # Política de assinatura 0.2.0 — única versão implementada (IG seguranca SES-GO).
    # JAdES-B-B (resultado "iat") ou JAdES-B-T cumulativo (resultado "tsa") via EU DSS.
    # -------------------------------------------------------------------------
    - version: "https://fhir.saude.go.gov.br/r4/seguranca/assinatura/politica/0.2.0"
      operation: SIGNING
      steps:
        - "context-validation"
        - "payload-validation"
        - "pkix-chain-validation"
        - "certificate-policy"
        - "framed-content-digest"
        - "jades-data-to-sign"
        - "crypto-signing"
        - "jades-assemble"
        - "jades-extension"
        - "tsa-token-verification"
        - "fhir-signature"

    - version: "https://fhir.saude.go.gov.br/r4/seguranca/assinatura/politica/0.2.0"
      operation: VALIDATION
      steps:
        - "validation-context"
        - "signature-binding"
        - "jws-structure"
        - "content-integrity"
        - "signer-certificate"
        - "dss-validation"
        - "timestamp-validation"
        - "validation-outcome"

  # ---------------------------------------------------------------------------
  # Política de assinatura 0.2.0 — entrada 8 dos casos de uso (criar/validar)
  # ---------------------------------------------------------------------------
  policy:
    # Allowlist de políticas de certificado folha: OID completo (7 arcos), tipo (A3 | A4 | SE-S | SE-H)
    # e SHA-256 (hex minúsculo) do DER do certificado da AC emissora imediata. Obrigatória:
    # sem ela toda operação retorna CONFIG.INVALID-PARAMETER. Exemplo:
    #   accepted-certificate-policies:
    #     - oid: "2.16.76.1.2.3.<n>"
    #       type: A3
    #       issuer-sha256: "<64 dígitos hexadecimais>"
    accepted-certificate-policies: []

    # Políticas TSA aceitas (obrigatórias no resultado "tsa" e para validar JAdES-B-T).
    # trust-store.reference: bundle PEM (file:... | classpath:...) com as âncoras da TSA,
    # separado do acervo ICP-Brasil do signatário. Exemplo:
    #   tsa-policies:
    #     version: "1.0.0"
    #     policies:
    #       - oid: "<OID da política da ACT>"
    #         max-accuracy-seconds: 1
    #         trust-store:
    #           reference: "file:/etc/safira/tsa-anchors.pem"

    temporal-policy:
      # Data mínima de emissão do certificado folha (epoch seconds UTC). Padrão: 1751328000 (2025-07-01).
      min-cert-issue-date: 1751328000

  # ---------------------------------------------------------------------------
  # Configurações Operacionais do Engine de Assinatura Digital
  # ---------------------------------------------------------------------------
  operational:

    # -------------------------------------------------------------------------
    # Verificação: controle de OCSP, CRL e TSA
    # -------------------------------------------------------------------------
    verification:
      # Timeout (em segundos) para consultas OCSP.
      # Pode ser limitado por políticas CORS em ambiente browser.
      # Padrão: 20 | Intervalo válido: [5, 120]
      ocsp-timeout: 20

      # Timeout (em segundos) para download de CRL.
      # Pode ser limitado por políticas CORS em ambiente browser.
      # Padrão: 20 | Intervalo válido: [5, 120]
      crl-timeout: 20

      # Timeout (em segundos) para comunicação com serviço TSA (RFC 3161).
      # Padrão: 20 | Intervalo válido: [5, 120]
      tsa-timeout: 20

      # URL do serviço TSA (RFC 3161). Obrigatória quando estratégia de timestamp é TSA.
      # Deve iniciar com https:// conforme RFC 3986.
      tsa-url: "https://tsa.example.com"

    # -------------------------------------------------------------------------
    # Limites de segurança para processamento de Bundles FHIR
    # -------------------------------------------------------------------------
    security:
      # Número máximo de entradas na instância do Bundle.
      # Padrão: 1000 | Intervalo válido: [100, 10000]
      max-entries-bundle: 1000

      # Tamanho máximo da instância do Bundle em bytes.
      # Padrão: 52428800 (50 MB) | Intervalo válido: [1048576, 209715200] (1 MB - 200 MB)
      max-bundle-size: 52428800
