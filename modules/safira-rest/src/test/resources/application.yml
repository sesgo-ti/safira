# Desativa cargas em background do trust-store: os beans são mockados nos testes e
# chamadas concorrentes nos mocks corrompem o stubbing do Mockito.
icpbrasil-truststore:
  scheduling:
    enabled: false
  bootstrap:
    enabled: false
  filesystem:
    base-dir: target/icpbrasil-truststore-test

safira:
  # ---------------------------------------------------------------------------
  # Configuração das Pipelines de Assinatura e Verificação
  #
  # Estrutura:
  #   pipelines: Lista de definições de pipelines.
  #     - version: Identificador da versão do Guia de Implementação FHIR.
  #                Formato: "URL_CANONICA|VERSAO"
  #     - operation: Tipo da operação. Valores possíveis: [SIGNING, VALIDATION]
  #     - steps: Lista ordenada de IDs dos passos (steps) a serem executados.
  # ---------------------------------------------------------------------------
  pipelines:
    - version: "https://fhir.saude.go.gov.br/r4/seguranca/ImplementationGuide/br.go.ses.seguranca|0.1.0"
      operation: SIGNING
      steps:
        - "context-validation"
        - "payload-validation"
        - "chain-build"
        - "payload-preparation"
        - "json-canonicalizer"
        - "content-digest"
        - "protected-header"
        - "signing-input"
        - "crypto-signing"
        - "jws-preliminary"
        - "tsa-timestamp"
        - "jws-final"
        - "fhir-signature"

    - version: "https://fhir.saude.go.gov.br/r4/seguranca/ImplementationGuide/br.go.ses.seguranca|1.1.0"
      operation: SIGNING
      steps:
        - "context-validation"
        - "payload-validation"
        - "chain-build"
        - "chain-validation"
        - "payload-preparation"
        - "json-canonicalizer"
        - "content-digest"
        - "protected-header"
        - "signing-input"
        - "crypto-signing"
        - "jws-preliminary"
        - "tsa-timestamp"
        - "jws-final"
        - "fhir-signature"

    - version: "https://fhir.saude.go.gov.br/r4/seguranca/ImplementationGuide/br.go.ses.seguranca|1.1.0"
      operation: VALIDATION
      steps:
        - "validation-context-validation"
        - "jws-extraction"
        - "jws-headers-validation"
        - "validation-chain-build"
        - "validation-chain-validation"
        - "validation-signature-verification"
        - "validation-ltv-revocation-check"
        - "validation-timestamp-policy"
        - "validation-payload-integrity"
        - "validation-success"

    # -------------------------------------------------------------------------
    # Política 2.0.0 — perfil JAdES-conforme (ETSI TS 119 182-1) via EU DSS
    # -------------------------------------------------------------------------
    - version: "https://fhir.saude.go.gov.br/r4/seguranca/ImplementationGuide/br.go.ses.seguranca|2.0.0"
      operation: SIGNING
      steps:
        - "context-validation"
        - "payload-validation"
        - "chain-build"
        - "chain-validation"
        - "payload-preparation"
        - "json-canonicalizer"
        - "content-digest"
        - "jades-data-to-sign"
        - "crypto-signing"
        - "jades-assemble"
        - "jades-extension"
        - "fhir-signature"

  # ---------------------------------------------------------------------------
  # Configurações Operacionais do Engine de Assinatura Digital
  # ---------------------------------------------------------------------------
  operational:

    # -------------------------------------------------------------------------
    # Verificação: controle de OCSP, CRL e TSA
    # -------------------------------------------------------------------------
    verification:
      # Tempo de vida (em segundos) para respostas OCSP em cache.
      # Usa timestamp Unix UTC para controle de expiração.
      # Padrão: 3600 | Intervalo válido: [300, 86400]
      ocsp-cache-ttl: 3600

      # Tempo de vida (em segundos) para listas CRL em cache.
      # Usa timestamp Unix UTC para controle de expiração.
      # Padrão: 3600 | Intervalo válido: [300, 86400]
      crl-cache-ttl: 3600

      # Timeout (em segundos) para consultas OCSP.
      # Pode ser limitado por políticas CORS em ambiente browser.
      # Padrão: 20 | Intervalo válido: [5, 120]
      ocsp-timeout: 20

      # Timeout (em segundos) para download de CRL.
      # Pode ser limitado por políticas CORS em ambiente browser.
      # Padrão: 20 | Intervalo válido: [5, 120]
      crl-timeout: 20

      # Timeout (em segundos) para comunicação com serviço TSA (RFC 3161).
      # Padrão: 20 | Intervalo válido: [5, 120]
      tsa-timeout: 20

      # Número máximo de tentativas para consultas OCSP/CRL/TSA em falha de rede.
      # Padrão: 3 | Intervalo válido: [1, 5]
      max-retries: 3

      # Intervalo (em segundos) entre tentativas de retry.
      # Padrão: 2 | Intervalo válido: [1, 10]
      retry-interval: 2

      # URL do serviço TSA (RFC 3161). Obrigatória quando estratégia de timestamp é TSA.
      # Deve iniciar com https:// conforme RFC 3986.
      tsa-url: "https://tsa.example.com"

      # (Opcional) Usuário para autenticação HTTP Basic no serviço TSA.
      # Será codificado junto com tsa-password no header: Authorization: Basic <base64(user:pass)>
      # tsa-username: ""

      # (Opcional) Senha para autenticação HTTP Basic no serviço TSA.
      # tsa-password: ""

    # -------------------------------------------------------------------------
    # Limites de segurança para processamento de Bundles FHIR
    # -------------------------------------------------------------------------
    security:
      # Número máximo de entradas na instância do Bundle.
      # Padrão: 1000 | Intervalo válido: [100, 10000]
      max-entries-bundle: 1000

      # Tamanho máximo da instância do Bundle em bytes.
      # Padrão: 52428800 (50 MB) | Intervalo válido: [1048576, 209715200] (1 MB - 200 MB)
      max-bundle-size: 52428800

      # Timeout (em segundos) para verificação do Bundle.
      # Padrão: 10 | Intervalo válido: [5, 300]
      timout-verification-bundle: 10

      # Limite inferior (epoch seconds) do timestamp de referência. Padrão: 1751328000 (2025-07-01T00:00:00Z).
      min-reference-timestamp: 1751328000

      # Limite superior (epoch seconds) do timestamp de referência. Padrão: 4102444800 (2100-01-01T00:00:00Z).
      max-reference-timestamp: 4102444800

    # -------------------------------------------------------------------------
    # Middleware criptográfico para SMARTCARD / TOKEN (PKCS#11)
    # -------------------------------------------------------------------------
    middleware-crypto:

      # Biblioteca PKCS#11 nativa
      library:
        # Caminho absoluto para a biblioteca PKCS#11 (.dll no Windows / .so no Linux).
        # O arquivo deve existir e ser acessível pelo processo.
        path: "/usr/lib/pkcs11/libpkcs11.so"

        # Especificação de arquitetura da biblioteca, se necessário para compatibilidade.
        # Exemplos: "32", "64"
        architecture: "64"

      # Configurações PKCS#11
      pkcs11:
        # Identificador do slot (inteiro não negativo).
        # Deixe comentado para descoberta automática.
        slot-id: 0

        # Label do token (até 32 caracteres UTF-8).
        # Usado para identificar o token quando múltiplos estão presentes.
        token-label: "SafiraToken"

        # Mecanismos PKCS#11 suportados pelo dispositivo.
        # Valores válidos: CKM_RSA_PKCS | CKM_ECDSA
        mecanismos:
          - "CKM_RSA_PKCS"

      # Configurações de sessão PKCS#11
      session:
        # Tipo de acesso à sessão PKCS#11.
        # Valores: read-only | read-write. Padrão: read-only
        modo: "read-only"

        # Tempo de inatividade (em segundos) antes de encerrar a sessão automaticamente.
        # Padrão: 300 | Intervalo válido: [60, 3600]
        timeout-inatividade: 300

        # Número máximo de tentativas de autenticação (PIN) antes de bloquear o token.
        # Padrão: 3 | Intervalo válido: [1, 10]
        tentativas-autenticacao: 3

      # Configurações de conectividade com o middleware
      connectivity:
        # Timeout (em segundos) para estabelecer conexão com o middleware.
        # Padrão: 10 | Intervalo válido: [3, 60]
        timeout-conexao: 10

        # Intervalo (em segundos) entre tentativas de reconexão.
        # Padrão: 2 | Intervalo válido: [1, 30]
        intervalo-retry: 2

        # Número máximo de tentativas de reconexão.
        # Padrão: 3 | Intervalo válido: [0, 10]
        maximo-retries: 3

    # -------------------------------------------------------------------------
    # Política de validação de assinaturas
    # -------------------------------------------------------------------------
    validation-policy:
      near-expiry-threshold-days: 30
      signature-age-threshold-days: 365
      revocation-policy: STRICT
      ocsp-unknown-handling: TREAT_AS_REVOKED
