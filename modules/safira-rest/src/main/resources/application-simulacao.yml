# -----------------------------------------------------------------------------
# Perfil "simulacao" — PKI própria no lugar do acervo ICP-Brasil (SEM VALOR LEGAL).
# Uso: java -jar safira-rest.jar --spring.profiles.active=simulacao, com as
# variáveis SAFIRA_SIMULACAO_* abaixo (ou um application-simulacao.yml gerado pelo
# GeradorPkiSimulada via --spring.config.additional-location). Ver README.
# -----------------------------------------------------------------------------

# Sem download do acervo do ITI: a confiança vem só das raízes simuladas.
icpbrasil-truststore:
  bootstrap:
    enabled: false
  scheduling:
    enabled: false
  filesystem:
    base-dir: ${SAFIRA_TRUSTSTORE_DIR:${java.io.tmpdir}/safira-simulacao/icpbrasil-truststore}

safira:
  simulacao:
    enabled: true
    # Bundle PEM com as raízes autoassinadas (obrigatório; ex.: file:/tmp/pki/raiz.pem)
    trust-anchors: ${SAFIRA_SIMULACAO_TRUST_ANCHORS:}
    # Bundle PEM com as ACs intermediárias (opcional)
    intermediates: ${SAFIRA_SIMULACAO_INTERMEDIATES:}
    # LCRs locais separadas por vírgula (opcional; sem elas a revogação é buscada online)
    crls: ${SAFIRA_SIMULACAO_CRLS:}

  policy:
    accepted-certificate-policies:
      - oid: ${SAFIRA_SIMULACAO_POLICY_OID:2.16.76.1.2.3.999}
        type: A3
        # SHA-256 (hex minúsculo) do DER da AC emissora do signatário simulado
        issuer-sha256: ${SAFIRA_SIMULACAO_ISSUER_SHA256:}
