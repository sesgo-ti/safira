# -----------------------------------------------------------------------------
# Perfil "simulacao" — PKI própria no lugar do acervo ICP-Brasil (SEM VALOR LEGAL).
# Ativado com --spring.profiles.active=simulacao numa aplicação que inclua o
# safira-rest e o safira-simulador, com as variáveis SAFIRA_SIMULACAO_* abaixo (ou
# um application-simulacao.yml gerado pelo GeradorPkiSimulada via
# --spring.config.additional-location). Ver README.
# -----------------------------------------------------------------------------

safira:
  simulacao:
    enabled: true
    # Bundle PEM com as raízes autoassinadas (obrigatório; ex.: file:/tmp/pki/raiz.pem)
    trust-anchors: ${SAFIRA_SIMULACAO_TRUST_ANCHORS:}
    # Bundle PEM com as ACs intermediárias (opcional)
    intermediates: ${SAFIRA_SIMULACAO_INTERMEDIATES:}
    # LCRs locais separadas por vírgula (opcional; sem elas a revogação não é obtida,
    # pois o modo simulação não acessa a rede)
    crls: ${SAFIRA_SIMULACAO_CRLS:}

  policy:
    accepted-certificate-policies:
      - oid: ${SAFIRA_SIMULACAO_POLICY_OID:2.16.76.1.2.3.1}
        type: A3
        # SHA-256 (hex minúsculo) do DER da AC emissora do signatário simulado
        issuer-sha256: ${SAFIRA_SIMULACAO_ISSUER_SHA256:}
