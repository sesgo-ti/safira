safira:
  # pipelines.operation: [SIGNING, VERIFICATION]
  # pipeline.steps: steps id in the order they will be executed
  # pipelines.version: FHIR Implementation Guide version
  pipelines:
    - version: "https://fhir.saude.go.gov.br/r4/seguranca/ImplementationGuide/br.go.ses.seguranca|0.1.0"
      operation: SIGNING
      steps:
        - "json-canonicalizer"
    - version: "https://fhir.saude.go.gov.br/r4/seguranca/ImplementationGuide/br.go.ses.seguranca|0.1.0"
      operation: VERIFICATION
      steps:
        - "json-canonicalization-validator"